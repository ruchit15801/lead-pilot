services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "4000:4000"
    env_file: .env
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: uncomment to use MongoDB instead of file store
  # mongo:
  #   image: mongo:8
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped

volumes:
  app-data:
  # mongo-data:
